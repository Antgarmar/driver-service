spring:
  application:
    name: driver-service

  # ─── Base de datos ────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/driver_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # ─── Redis ────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ─── Seguridad / OAuth2 ───────────────────────────────────────────────────────
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8081/realms/mini-uber

# ─── Servidor ──────────────────────────────────────────────────────────────────
server:
  port: 8082

# ─── Logging ───────────────────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %blue([%thread]) %highlight(%-5level) %cyan(%logger{36}) - %green(%msg%n)"

# ─── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
