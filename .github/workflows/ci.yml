name: CI Pipeline

on:
  push:
    branches:
      - '**'          # Se ejecuta en cualquier push a cualquier rama
  pull_request:
    branches:
      - '**'          # También en pull requests

jobs:
  build:
    name: 🔨 Build, Test & Sonar
    runs-on: ubuntu-latest

    steps:

      # ─── 1. Checkout del código ──────────────────────────────────────────────
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Sonar necesita el historial completo

      # ─── 2. Configurar Java 21 ───────────────────────────────────────────────
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ─── 3. Cache de Maven ───────────────────────────────────────────────────
      - name: 📦 Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ─── 4. Maven clean install (compila + tests) ────────────────────────────
      - name: 🧪 Maven clean install
        run: mvn clean install -B
        env:
          MAVEN_OPTS: "-Xmx1024m"

      # ─── 5. Análisis SonarQube ───────────────────────────────────────────────
      - name: 🔍 SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=driver-service \
            -Dsonar.projectName="driver-service" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -B
        env:
          MAVEN_OPTS: "-Xmx1024m"

      # ─── 6. Publicar resultados de tests ─────────────────────────────────────
      - name: 📊 Publicar resultados de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

